<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Comma — Лента</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="index/index.css">
</head>
<body>
    <div class="sticky">
        <div class="upload-prompt-top">
            <a href="/" class="upload-button-top" id="add">
                <i class="fas fa-home"></i>Главная
            </a>

            <a class="upload-button-top" href="/call/" id="call">
                <i class="fas fa-phone"></i>Звонок
            </a>

            <a class="upload-button-top" href="/profile/" id="reg">
                <i class="fas fa-user"></i>Профиль
            </a>
        </div>
    </div>

    <div class="recommendations-card" id="recommendations-card">
        <div class="feed-block">
            <div class="user">
                <div class="avatar-placeholder">
                    <i class="far fa-user"></i>
                </div>
                <a class="user-name" href="/profile/" id="id">Загрузка...</a>
            </div>

            <textarea class="text-input" id="postText" placeholder="Что у вас нового?"></textarea>

            <progress class="post-progress" id="progress" value="0" max="100"></progress>

            <div class="upload">
                <input type="file" id="file_input">
                <label for="file_input" class="file-input-label" id="upload_file">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-paperclip" viewBox="0 0 16 16">
                        <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0z" />
                    </svg>
                </label>

                <button class="text-input-label" onclick="new_text_post()">
                    <i class="fas fa-cloud-upload-alt"></i>Добавить пост
                </button>
            </div>
        </div>

        <div class="feature-note"></div>

        <div id="feed_container" class="feed">

        </div>

        <h1 id="load" class="load">Загрузка...</h1>

        <div class="upload-prompt">
            <a href="/" class="upload-button">
                <i class="fa fa-caret-up"></i>Наверх
            </a>
        </div>

        <div class="feature-note">
            <span><i class="fas fa-sync-alt"></i>Обновляется ежедневно</span>
            <span><i class="fas fa-mobile-alt"></i>Адаптивно</span>
            <span><i class="fas fa-infinity"></i>Без регистрации</span>
        </div>
    </div>

    <script src="index/index.js"></script>
    <script src="/assets/agreement.js"></script>
</body>
</html>
